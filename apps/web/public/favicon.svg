<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="28" stroke="#1a2e44" stroke-width="2.5" fill="white"/>

  <!-- Equator (horizontal middle) -->
  <ellipse cx="32" cy="32" rx="28" ry="6" stroke="#1a2e44" stroke-width="1.8" fill="none"/>

  <!-- Upper latitude band -->
  <ellipse cx="32" cy="20" rx="21" ry="4.5" stroke="#1a2e44" stroke-width="1.4" fill="none"/>

  <!-- Lower latitude band -->
  <ellipse cx="32" cy="44" rx="21" ry="4.5" stroke="#1a2e44" stroke-width="1.4" fill="none"/>

  <!-- Vertical meridian -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#1a2e44" stroke-width="1.8"/>

  <!-- Tilted meridian 1 (left-leaning) -->
  <path d="M 32 4 Q 12 32 32 60" stroke="#1a2e44" stroke-width="1.3" fill="none"/>

  <!-- Tilted meridian 2 (right-leaning) -->
  <path d="M 32 4 Q 52 32 32 60" stroke="#1a2e44" stroke-width="1.3" fill="none"/>
</svg>
